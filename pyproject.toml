[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-ai-studio"
version = "3.2.0"
description = "Multi-model LLM orchestration harness for Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
documents = ["pypdf>=3.9", "openpyxl>=3.1"]
dnd = ["tkinterdnd2>=0.3"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ai-chat-lab = "aichatlab.ui:main"

[tool.setuptools.packages.find]
include = ["aichatlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
