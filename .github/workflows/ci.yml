name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests pypdf openpyxl
          pip install -r requirements-web.txt httpx
          pip install pytest ruff

      - name: Lint
        run: ruff check aichatlab tests

      - name: Test
        run: xvfb-run -a pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the hosted-edition image
        run: docker build -t ensemble-ai-studio:ci .
      - name: Boot it and hit the health check
        run: |
          docker run -d --name eas -p 8080:8080 -e GEMINI_API_KEY=ci-placeholder ensemble-ai-studio:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs eas; exit 1
